<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PigPig - Running away from bath</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#cc66cc">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
      touch-action: manipulation;
    }
    body {
      background-image: url('bathroom_fullscreen.png');
      background-size: cover;
      background-position: center bottom;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 20px;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
      z-index: 3;
    }
    .game {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 200px;
      overflow: hidden;
      z-index: 2;
    }
    .dino {
      position: absolute;
      bottom: 0;
      left: 50px;
      width: 80px;
      height: 80px;
      background-image: url('pigpig_clean_hd.png');
      background-size: cover;
      background-repeat: no-repeat;
    }
    .cactus {
      position: absolute;
      bottom: 0;
      right: -60px;
      width: 60px;
      height: 60px;
      background-image: url('evilsoap.png');
      background-size: contain;
      background-repeat: no-repeat;
      animation: moveCactus 2s linear infinite;
    }
    @keyframes moveCactus {
      0% { right: -60px; }
      100% { right: 100vw; }
    }
    .jump {
      animation: jump 0.5s ease-out;
    }
    @keyframes jump {
      0% { bottom: 0; }
      50% { bottom: 140px; }
      100% { bottom: 0; }
    }
    #gameOver {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0,0,0,0.7);
      color: white;
      font-size: 28px;
      text-align: center;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 4;
    }
    #gameOver button {
      margin-top: 20px;
      font-size: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }
    #difficultyBarContainer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 6px;
      background-color: rgba(255, 255, 255, 0.2);
      z-index: 5;
    }
    #difficultyBar {
      height: 100%;
      width: 0%;
      background-color: #00cc66;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
  </style>
</head>
<body>
  <div id="difficultyBarContainer">
    <div id="difficultyBar"></div>
  </div>
  <div id="score">Pontuação: 0</div>
  <div class="game" id="gameArea">
    <div class="dino" id="dino"></div>
    <div class="cactus" id="cactus"></div>
  </div>

  <div id="gameOver">
    <div id="finalScore"></div>
    <button onclick="location.reload()">Reiniciar</button>
  </div>

  <!-- Sons locais -->
  <audio id="jumpSound" src="jump.mp3"></audio>
  <audio id="hitSound" src="slide.mp3"></audio>
  <audio id="failSound" src="fail.mp3"></audio>

  <script>
    const dino = document.getElementById("dino");
    const cactus = document.getElementById("cactus");
    const scoreDisplay = document.getElementById("score");
    const gameOverScreen = document.getElementById("gameOver");
    const finalScoreText = document.getElementById("finalScore");

    const jumpSound = document.getElementById("jumpSound");
    const hitSound = document.getElementById("hitSound");
    const failSound = document.getElementById("failSound");

    let score = 0;
    let gameRunning = true;

    function jump() {
      if (!dino.classList.contains("jump")) {
        dino.classList.add("jump");
        jumpSound.currentTime = 0;
        jumpSound.play();
        setTimeout(() => {
          dino.classList.remove("jump");
        }, 500);
      }
    }

    document.addEventListener("keydown", jump);
    document.addEventListener("touchstart", jump);

    const scoreInterval = setInterval(() => {
      if (gameRunning) {
        score++;
        scoreDisplay.textContent = "Pontuação: " + score;
      }
    }, 100);

    const checkCollision = setInterval(() => {
      const dinoTop = parseInt(window.getComputedStyle(dino).getPropertyValue("bottom"));
      const cactusLeft = parseInt(window.getComputedStyle(cactus).getPropertyValue("right"));
      const cactusWidth = cactus.offsetWidth;
      const dinoLeft = dino.offsetLeft;

      if (
        cactusLeft < (window.innerWidth - dinoLeft) &&
        cactusLeft > (window.innerWidth - dinoLeft - cactusWidth) &&
        dinoTop < 70
      ) {
        gameRunning = false;
        clearInterval(difficultyInterval);
        hitSound.play();
        failSound.play();
        clearInterval(scoreInterval);
        clearInterval(checkCollision);
        finalScoreText.innerHTML = `🧼 PigPig foi pego!<br>Pontuação final: <strong>${score}</strong>`;
        gameOverScreen.style.display = "flex";
      }
    }, 10);

    // Dificuldade progressiva com barra de cor
    let progress = 0;
    let difficultyInterval = setInterval(() => {
      if (gameRunning) {
        const currentWidth = parseInt(window.getComputedStyle(cactus).getPropertyValue("width"));
        const newWidth = Math.min(currentWidth + 2, 120);
        cactus.style.width = newWidth + "px";
        cactus.style.height = newWidth + "px";

        const currentDuration = parseFloat(getComputedStyle(cactus).animationDuration);
        const newDuration = Math.max(currentDuration - 0.1, 0.8);
        cactus.style.animation = `moveCactus ${newDuration}s linear infinite`;

        progress = Math.min(progress + 10, 100);
        const bar = document.getElementById("difficultyBar");
        bar.style.width = progress + "%";

        // Trocar cor da barra
        if (progress < 40) {
          bar.style.backgroundColor = "#00cc66"; // verde
        } else if (progress < 80) {
          bar.style.backgroundColor = "#ffcc00"; // amarelo
        } else {
          bar.style.backgroundColor = "#ff0033"; // vermelho
        }
      }
    }, 5000);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
