<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PigPig - Running away from bath</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="theme-color" content="#cc66cc">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; font-family: sans-serif; touch-action: manipulation; }
    body {
      background-image: url('bathroom_fullscreen.png');
      background-size: cover;
      background-position: center bottom;
    }
    #startScreen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.7);
      color: white; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 10; text-align: center;
    }
    #startScreen h1 { font-size: 32px; margin-bottom: 20px; }
    #startScreen button { font-size: 20px; padding: 12px 24px; cursor: pointer; }
    #score, #highScore {
      position: absolute; top: 10px; font-size: 18px; font-weight: bold;
      color: #fff; text-shadow: 1px 1px 2px #000; z-index: 3;
    }
    #score { left: 10px; }
    #highScore { right: 10px; }
    .game {
      position: fixed; bottom: 0; left: 0; width: 100vw; height: 200px;
      overflow: hidden; z-index: 2; display: none;
    }
    .dino {
      position: absolute; bottom: 0; left: 40px; width: 70px; height: 70px;
      background-image: url('pigpig_clean_hd.png');
      background-size: cover; background-repeat: no-repeat;
      border: 2px dashed red;
    }
    .cactus {
      position: absolute; bottom: 0; right: -60px; width: 60px; height: 60px;
      background-image: url('evilsoap.png');
      background-size: contain; background-repeat: no-repeat;
      animation: moveCactus 2s linear infinite;
      border: 2px dashed red;
    }
    @keyframes moveCactus {
      0% { right: -60px; } 100% { right: 100vw; }
    }
    .jump { animation: jump 0.5s ease-out; }
    @keyframes jump {
      0% { bottom: 0; } 50% { bottom: 180px; } 100% { bottom: 0; }
    }
    #gameOver {
      display: none; position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh; background-color: rgba(0,0,0,0.7);
      color: white; font-size: 28px; text-align: center;
      justify-content: center; align-items: center; flex-direction: column;
      z-index: 4;
    }
    #gameOver button {
      margin-top: 20px; font-size: 20px; padding: 10px 20px; cursor: pointer;
    }
    #difficultyBarContainer {
      position: fixed; top: 0; left: 0; width: 100%; height: 6px;
      background-color: rgba(255, 255, 255, 0.2); z-index: 5;
    }
    #difficultyBar {
      height: 100%; width: 0%; background-color: #00cc66;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    #lineDebug {
      position: fixed; bottom: 60px; width: 100%; height: 1px;
      background: black; z-index: 9999;
    }
  </style>
</head>
<body>
